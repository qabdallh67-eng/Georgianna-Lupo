    />

      property="og:description"
      content="تعلم بذكاء وحقق أهدافك عبر منصة EDUVERSE التعليمية: كورسات منظمة، مشغل فيديو محمي، اختبارات، ومتابعة مستمرة."

      content="منصة EDUVERSE التعليمية المتكاملة للتعلم الآمن والامتحانات الذكية."
    />
    <meta name="twitter:image" content="/assets/eduverse-logo.png" />

      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('eduverse_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || (savedTheme === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');

          var savedLang = localStorage.getItem('eduverse_lang') || 'ar';
          document.documentElement.lang = savedLang === 'en' ? 'en' : 'ar';
          document.documentElement.dir = savedLang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "EDUVERSE",
        "description": "منصة تعليمية شاملة للبرمجة والعلوم ببث فيديو محمي وامتحانات تفاعلية.",
        "logo": "/assets/eduverse-logo.png"
      }
    </script>
  </head>
  <body class="bg-[#F6F7FB] text-[#171B2D] dark:bg-[#0D111D] dark:text-[#F1F5F9] antialiased selection:bg-[#635BFF]/20 selection:text-[#635BFF]">
