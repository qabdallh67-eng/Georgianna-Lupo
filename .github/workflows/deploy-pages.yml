name: EDUVERSE Build Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eduverse-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Build Vercel-ready site
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://suldaiuxaxremmfxodak.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_2DNkpNQLXsqD10FafiaEIA_9pz90chV
