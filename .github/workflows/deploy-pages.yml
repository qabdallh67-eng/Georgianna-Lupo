name: Build and publish EDUVERSE to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: https://suldaiuxaxremmfxodak.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_2DNkpNQLXsqD10FafiaEIA_9pz90chV

      - name: Prepare GitHub Pages files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published URL
        run: echo "EDUVERSE published at ${{ steps.deployment.outputs.page_url }}"
